name: Build content commitments

on:
  push:
    paths:
      - 'data/pilot/canonical/**'
      - 'data/pilot/pre-release/**'
      - 'spec/canonical-entry-v0.4.schema.json'
      - 'scripts/validate_canonical.py'
      - 'scripts/build_content_hashes.py'
      - 'docs/pilot/canonical-serialization.md'
      - 'requirements-pilot.txt'
      - '.github/workflows/build-content-hashes.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-pilot.txt
      - name: Revalidate canonical entries
        run: python scripts/validate_canonical.py
      - name: Verify deterministic content commitments
        run: python scripts/build_content_hashes.py --check data/pilot/pre-release/content-hashes.json
