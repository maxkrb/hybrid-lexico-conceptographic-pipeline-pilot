name: Build P1 evaluation set

on:
  push:
    branches: [main]
    paths:
      - 'src/minimal_api.py'
      - 'scripts/generate_eval_query_set.py'
      - 'scripts/evaluate_p1.py'
      - 'eval/**'
      - 'data/pilot/canonical/**'
      - 'data/pilot/pre-release/evidence-registry.json'
      - 'requirements-pilot.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned pilot dependencies
        run: python -m pip install -r requirements-pilot.txt
      - name: Generate deterministic Q+/Q- set
        run: python scripts/generate_eval_query_set.py
      - name: Run deterministic P1 evaluation
        run: python scripts/evaluate_p1.py
      - name: Rebuild and compare byte-for-byte
        shell: bash
        run: |
          cp eval/query-set-v0.1.json /tmp/query-set.json
          cp eval/results-v0.1.json /tmp/results.json
          python scripts/generate_eval_query_set.py
          python scripts/evaluate_p1.py
          cmp /tmp/query-set.json eval/query-set-v0.1.json
          cmp /tmp/results.json eval/results-v0.1.json
      - name: Commit generated evaluation artifacts if changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- eval/query-set-v0.1.json eval/results-v0.1.json)" ]; then
            echo 'Evaluation artifacts unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eval/query-set-v0.1.json eval/results-v0.1.json
          git commit -m 'Generate deterministic P1 evaluation set and results'
          git push
