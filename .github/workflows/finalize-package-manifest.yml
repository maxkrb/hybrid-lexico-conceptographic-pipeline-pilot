name: Finalize portable package manifest

on:
  push:
    branches: [publication-package-staging]
    paths:
      - '.github/workflows/finalize-package-manifest.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify final portable manifest
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          find . -type f \
            ! -path './.git/*' \
            ! -path './reproducibility/PACKAGE-FILES.sha256' \
            ! -path './.github/workflows/finalize-package-manifest.yml' \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > "$tmp"
          test "$(wc -l < "$tmp")" -eq 112
          test "$(sha256sum "$tmp" | awk '{print $1}')" = '51c3304b18ae8e31e59c6ab8db1a19347259ce72c470de2724b95239e80efc1f'
          cp "$tmp" reproducibility/PACKAGE-FILES.sha256
          sha256sum -c reproducibility/PACKAGE-FILES.sha256
      - name: Commit final manifest if changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- reproducibility/PACKAGE-FILES.sha256)" ]; then
            echo 'Portable package manifest already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reproducibility/PACKAGE-FILES.sha256
          git commit -m 'Pre-release: refresh portable package hash manifest'
          git push
